name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags for the changelog

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix

      - name: Build DLL
        run: make -j"$(nproc)"

      - name: Work out version
        id: version
        run: |
          # AddonDef.Version = { major, minor, build, revision } in src/main.cpp
          ver=$(grep -oP 'AddonDef\.Version\s*=\s*\{\s*\K[0-9]+\s*,\s*[0-9]+\s*,\s*[0-9]+' src/main.cpp | tr -d ' ' | tr ',' '.')
          [ -n "$ver" ] || { echo "could not read AddonDef.Version from src/main.cpp"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
        run: |
          cat > notes.md <<NOTES
          **Download:** [htcm_helper.dll](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/htcm_helper.dll)

          Copy \`htcm_helper.dll\` into \`<GW2>/addons/\`, then enable it in the Nexus menu (Ctrl+O). ArcDPS must be installed.

          Built from ${SHORT_SHA}.

          ## Changes
          NOTES
          # Commits since the previous build release (or just the head commit for the first one).
          prev=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" >/dev/null; then
            git log --no-merges --format='- %s (%h)' "$prev..$GITHUB_SHA" >> notes.md
          else
            git log -1 --format='- %s (%h)' "$GITHUB_SHA" >> notes.md
          fi

          gh release create "$TAG" build/htcm_helper.dll \
            --target "$GITHUB_SHA" \
            --title "HTCM Helper $VERSION (build $GITHUB_RUN_NUMBER)" \
            --notes-file notes.md \
            --latest
